[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorrun-agent"
version = "0.1.0"
description = "AnchorRun Agent: a local coding agent with constrained tools, memory, checkpoints, and evaluation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
anchorrun = "pico.cli:main"
pico = "pico.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["pico*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
